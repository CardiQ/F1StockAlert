name: add-watch

on:
  workflow_dispatch:
    inputs:
      url:
        description: Product page URL
        required: true
      option:
        description: Option to watch, as shown on the page (e.g. XS)
        required: true
      email:
        description: Email address to notify
        required: true
      every:
        description: How often to check (30m, 6h, 1d, 1w)
        required: true
        default: 30m

concurrency:
  group: watches
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  add:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Add watch
        env:
          URL: ${{ inputs.url }}
          OPTION: ${{ inputs.option }}
          EMAIL: ${{ inputs.email }}
          EVERY: ${{ inputs.every }}
          RESTOCK_PROFILE_DIR: ${{ runner.temp }}/chrome-profile
        # If the store blocks the runner, the watch is still added unverified.
        run: python watch.py add "$URL" --option "$OPTION" --email "$EMAIL" --every "$EVERY" || python watch.py add "$URL" --option "$OPTION" --email "$EMAIL" --every "$EVERY" --no-verify
      - run: |
          git config user.name "restock-watch[bot]"
          git config user.email "restock-watch@users.noreply.github.com"
          git add watches.json
          git diff --cached --quiet || (git commit -m "Add watch" && git push)
