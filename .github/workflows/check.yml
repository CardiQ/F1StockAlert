name: check

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: watches
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # The runner image ships Google Chrome; patchright drives it via channel="chrome".
      - name: Check watches
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          RESTOCK_PROFILE_DIR: ${{ runner.temp }}/chrome-profile
        run: python watch.py check
      - name: Save state
        if: always()
        run: |
          git config user.name "restock-watch[bot]"
          git config user.email "restock-watch@users.noreply.github.com"
          git add watches.json
          git diff --cached --quiet || (git commit -m "Update watch state" && git push)
